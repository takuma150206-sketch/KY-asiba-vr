<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;
    font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;}

  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;

  .btns button{flex:1;min-width:180px;font-size:18px;font-weight:bold;padding:14px;border:0;border-radius:10px;cursor:pointer;}

  #pcBtn{background:#1f2937;color:#fff;}

  #pcHelp{position:fixed;left:10px;bottom:10px;color:#fff;background:rgba(0,0,0,.55);padding:6px 12px;
    font-size:13px;border-radius:6px;display:none;z-index:5;}
</style>

<body>
<div id="overlay"><div class="card">
  <h1>足場からの墜落　危険予知（KY）体験VR〈試作〉</h1>
  <p>高さ約12.6mの足場の上に、墜落・転落につながる<b>危険箇所が6つ</b>あります。<b>制限時間90秒</b>で見つけて指差してください。</p>
  <ul>
    <li><b>Meta Quest</b>：「VRで開始」→ トリガー＝指差し／左スティック＝移動／右スティック＝向き変更</li>
    <li><b>PC</b>：「PCで開始」→ ドラッグ＝見回し／クリック＝指差し／WASD・矢印キー＝移動</li>
  </ul>
  <div class="warn">⚠ 高所と落下の演出があります。周囲の安全を確保し、できれば椅子に座って体験してください。気分が悪くなったらすぐに中止してください。</div>
  <p style="margin:10px 0 0"><label><input type="checkbox" id="fallOpt" checked> 落下演出あり（オフにすると暗転のみ）</label></p>
  <div class="btns">
    <button id="vrBtn" disabled>VRで開始</button>
    <button id="pcBtn">PCで開始（マウス）</button>
  </div>
  <div id="status">VR対応を確認中…</div>
</div></div>
<div id="pcHelp">ドラッグ：見回す ／ クリック：指差し ／ WASD・矢印：移動</div>

<script type="module">
import * as THREE from 'three';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

// ================= 設定 =================
const H = 12.6;            // 作業床（7層目）の高さ m
const LV = 1.8;            // 1層の高さ
const NL = 7;              // 層数
const TIME_LIMIT = 90;     // 制限時間 秒
const ZO = -0.55, ZI = 0.55, WALL_Z = 0.78;   // 外側建地・内側建地・躯体面
const XS = Array.from({length:11},(_,i)=>-9+i*1.8);
const START = new THREE.Vector3(0, H, 0.05);
const FONT = '"Noto Sans JP","Noto Sans CJK JP","Hiragino Sans","Yu Gothic","Meiryo",sans-serif';
let fallEffect = true;

// ================= 危険箇所データ =================
const HAZ = [
  { id:'rail', name:'手すり・中桟の欠落', short:'手すり・中桟なし',
    center:[4.5,H+0.5,-0.58], size:[1.85,1.2,0.42],
    fallFrom:[4.5,H,-0.05], fallTo:[4.5,H,-1.1],
    fallText:'手すりの無い端部でバランスを崩した瞬間…',
    measure:'作業床の端には高さ85cm以上の手すりと、高さ35〜50cmの中桟（＋幅木）を設ける（安衛則第563条）。作業のため一時的に外した場合は作業後ただちに復旧し、外している間はフルハーネス使用・立入禁止とする。' },
  { id:'open', name:'開口部（床板の抜け）', short:'開口部',
    center:[-6.3,H-0.05,-0.25], size:[1.85,0.5,0.6],
    fallFrom:[-5.0,H,-0.25], fallTo:[-6.3,H,-0.25],
    fallText:'床板の無い開口部に気づかず踏み出した瞬間…',
    measure:'開口部には丈夫な覆い（蓋）や手すり・囲いを設け、表示をする（安衛則第519条）。床板を外したら作業後ただちに復旧し、作業中は立入禁止措置をとる。' },
  { id:'harness', name:'フルハーネス未使用（フック未掛け）', short:'フック未掛け',
    center:[8.0,H+0.9,-0.15], size:[1.0,1.9,0.9],
    fallFrom:[8.0,H,0.25], fallTo:[8.0,H,-1.1],
    fallText:'フックを掛けずに身を乗り出した瞬間…',
    measure:'身を乗り出す作業や、手すり等の設置が困難な箇所ではフルハーネス型墜落制止用器具を使用し、フックを親綱など堅固な取付設備に常に掛ける（安衛則第518・521条）。高さ6.75mを超える箇所では原則フルハーネス型を使う。' },
  { id:'plank', name:'床板の隙間・浮き', short:'床板の浮き・隙間',
    center:[2.7,H+0.05,0.15], size:[1.9,0.35,1.0],
    fallFrom:[1.2,H,0.25], fallTo:[2.7,H,0.25],
    fallText:'浮いた床板を踏み、床板ごと外れた瞬間…',
    measure:'作業開始前に床材の浮き・ずれ・緊結状態を点検する（安衛則第567条）。床材間の隙間は3cm以下、床材と建地の隙間は12cm未満とし（同第563条）、床材は2か所以上で支持・固定する。' },
  { id:'ladder', name:'足場上での脚立の使用', short:'足場上の脚立',
    center:[-2.9,H+0.75,-0.22], size:[1.1,1.6,0.75],
    fallFrom:[-2.9,H+1.0,0.05], fallTo:[-2.9,H+1.0,-1.1],
    fallText:'脚立に乗り、体が手すりより上に出た瞬間…',
    measure:'足場の作業床で脚立や踏台を使うと、体が手すりより高くなり墜落しやすい。足場上では原則使用しない。高さが足りない場合は足場の層を追加するなど、適切な作業床を設ける。' },
  { id:'stuff', name:'足元の資材・つまずき物', short:'足元の資材',
    center:[-1.0,H+0.15,0], size:[1.7,0.4,1.1],
    fallFrom:[3.3,H,-0.05], fallTo:[4.5,H,-1.1],
    fallText:'足元の資材につまずき、体勢を崩して手すりの切れ目へ…',
    measure:'作業床に資材・工具・ケーブルを放置しない。整理整頓し、資材は所定の置場にまとめて結束し、通路幅を確保する。工具の落下防止（ひも付き工具・幅木・メッシュシート）も合わせて行う。' },
];

// ================= レンダラ・シーン =================
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8d3ec);
scene.fog = new THREE.Fog(0xb8d3ec, 90, 380);

const rig = new THREE.Group(); scene.add(rig);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.05, 800);
camera.position.set(0,1.6,0);
rig.add(camera);
rig.position.copy(START);

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a60, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.8); sun.position.set(-30,60,-40); scene.add(sun);

// ================= ユーティリティ =================
function canvasTex(w,h,draw,repeat){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8;
  if(repeat){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(repeat[0],repeat[1]); }
  return t;
}
const M = c => new THREE.MeshLambertMaterial({color:c});
const V = a => new THREE.Vector3(a[0],a[1],a[2]);
const UP = new THREE.Vector3(0,1,0);
function bar(a,b,t,mat,parent){
  const A=V(a),B=V(b),d=B.clone().sub(A),len=d.length();
  const m=new THREE.Mesh(new THREE.BoxGeometry(t,len,t),mat);
  m.position.copy(A).add(B).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(UP,d.normalize());
  parent.add(m); return m;
}
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function wrap(g,text,maxW){
  const lines=[]; let line='';
  for(const ch of text){
    if(ch==='\n'){ lines.push(line); line=''; continue; }
    const t=line+ch;
    if(g.measureText(t).width>maxW && line){ lines.push(line); line=ch; } else line=t;
  }
  if(line) lines.push(line);
  return lines;
}
function para(g,str,x,y,size,color,maxW,lh,draw,bold){
  g.font=`${bold?'bold ':''}${size}px ${FONT}`;
  const lines=wrap(g,str,maxW);
  if(draw){ g.fillStyle=color; g.textBaseline='top'; g.textAlign='left'; lines.forEach((l,i)=>g.fillText(l,x,y+i*size*lh)); }
  return y+lines.length*size*lh;
}
const smooth=(a,b,x)=>{ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };

// ================= テクスチャ =================
const groundTex = canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#8a7657'; g.fillRect(0,0,w,h);
  for(let i=0;i<2500;i++){ const v=100+Math.random()*60|0; g.fillStyle=`rgba(${v},${v-20},${v-50},0.5)`; g.fillRect(Math.random()*w,Math.random()*h,2,2); }
},[150,150]);
const padTex = canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#9a9a96'; g.fillRect(0,0,w,h);
  for(let i=0;i<1500;i++){ const v=130+Math.random()*50|0; g.fillStyle=`rgba(${v},${v},${v},0.5)`; g.fillRect(Math.random()*w,Math.random()*h,2,2); }
  g.strokeStyle='#7d7d79'; g.lineWidth=3; g.strokeRect(0,0,w,h);
},[12,7]);
const plankTex = canvasTex(512,128,(g,w,h)=>{
  g.fillStyle='#8f969d'; g.fillRect(0,0,w,h);
  g.fillStyle='#6b7178';
  for(let x=14;x<w;x+=22) for(let y=14;y<h;y+=22){ g.beginPath(); g.arc(x,y,5,0,Math.PI*2); g.fill(); }
  g.strokeStyle='#5d636a'; g.lineWidth=6; g.strokeRect(0,0,w,h);
});
const bldTex = canvasTex(512,512,(g,w,h)=>{
  g.fillStyle='#bdb8ae'; g.fillRect(0,0,w,h);
  for(let i=0;i<3000;i++){ const v=160+Math.random()*40|0; g.fillStyle=`rgba(${v},${v-4},${v-12},0.4)`; g.fillRect(Math.random()*w,Math.random()*h,2,2); }
  for(let r=0;r<2;r++){ g.fillStyle='#a6a197'; g.fillRect(0,r*256,w,16);
    for(let c=0;c<2;c++){ g.fillStyle='#46525e'; g.fillRect(c*256+44,r*256+70,168,130); g.fillStyle='#5d6b78'; g.fillRect(c*256+44,r*256+70,168,10);} }
},[8.5,2.25]);

// ================= 地上・周辺 =================
const pickWorld = [];   // クリック判定用の「普通の物」
const rayTargets = [];  // ポインター先端表示用

const ground = new THREE.Mesh(new THREE.PlaneGeometry(800,800), new THREE.MeshLambertMaterial({map:groundTex}));
ground.rotation.x=-Math.PI/2; scene.add(ground); pickWorld.push(ground); rayTargets.push(ground);
const pad = new THREE.Mesh(new THREE.PlaneGeometry(50,29.5), new THREE.MeshLambertMaterial({map:padTex}));
pad.rotation.x=-Math.PI/2; pad.position.set(0,0.02,-13.97); scene.add(pad);

const bH = H+3.6;
const building = new THREE.Mesh(new THREE.BoxGeometry(34,bH,20), new THREE.MeshLambertMaterial({map:bldTex}));
building.position.set(0,bH/2,WALL_Z+10); scene.add(building); pickWorld.push(building); rayTargets.push(building);

// 仮囲い
const fenceMat = M(0xe8ecef);
[[0,1.25,-28.7,50,2.5,0.1],[-25,1.25,-14,0.1,2.5,29.5],[25,1.25,-14,0.1,2.5,29.5]].forEach(a=>{
  const f=new THREE.Mesh(new THREE.BoxGeometry(a[3],a[4],a[5]),fenceMat); f.position.set(a[0],a[1],a[2]); scene.add(f);
});
// トラック
{ const t=new THREE.Group(); t.position.set(-10,0,-14); t.rotation.y=0.3;
  const bed=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.5,5),M(0x7b8794)); bed.position.set(0,1.1,0.6); t.add(bed);
  const cab=new THREE.Mesh(new THREE.BoxGeometry(2.2,1.9,1.7),M(0xf3f4f6)); cab.position.set(0,1.5,-2.6); t.add(cab);
  const wg=new THREE.CylinderGeometry(0.45,0.45,0.3,16); const wm=M(0x222222);
  [[-1.1,-2.3],[1.1,-2.3],[-1.1,1.6],[1.1,1.6]].forEach(([x,z])=>{const w=new THREE.Mesh(wg,wm); w.rotation.z=Math.PI/2; w.position.set(x,0.45,z); t.add(w);});
  scene.add(t); }
// 資材置場
[[7,0.3,-10,2.5,0.6,1.2,0x9b7b55],[7.2,0.85,-10,2.2,0.5,1.0,0x8a8f96],[10,0.4,-8,1.5,0.8,1.5,0x4b6b8c]].forEach(a=>{
  const b=new THREE.Mesh(new THREE.BoxGeometry(a[3],a[4],a[5]),M(a[6])); b.position.set(a[0],a[1],a[2]); scene.add(b);
});
// コーン
{ const cg=new THREE.ConeGeometry(0.18,0.7,12); const cm=M(0xf26b1d);
  for(let x=-8;x<=8;x+=4){ const c=new THREE.Mesh(cg,cm); c.position.set(x,0.35,-3); scene.add(c); } }
// 遠景のビル
{ const n=70; const im=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshLambertMaterial({color:0xffffff}), n);
  const m=new THREE.Matrix4(), q=new THREE.Quaternion(), col=new THREE.Color();
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, r=80+Math.random()*180;
    const w=10+Math.random()*25, h=8+Math.random()*55, d=10+Math.random()*25;
    q.setFromAxisAngle(UP,Math.random()*Math.PI);
    m.compose(new THREE.Vector3(Math.cos(a)*r,h/2,Math.sin(a)*r),q,new THREE.Vector3(w,h,d));
    im.setMatrixAt(i,m); const v=0.6+Math.random()*0.3; im.setColorAt(i,col.setRGB(v,v,v*1.03));
  }
  im.instanceColor.needsUpdate=true; scene.add(im); }

// ================= 足場 =================
const matPipe = M(0xa9afb6);
const matPlank = new THREE.MeshLambertMaterial({map:plankTex});
const matToe = M(0x8a9097);
const pipes=[], planksLow=[], planksTop=[], toes=[];
for(const x of XS) for(const z of [ZO,ZI]){ pipes.push([[x,0,z],[x,H+2.0,z]]); toes.push({pos:[x,0.02,z],size:[0.15,0.04,0.15]}); }
for(let k=1;k<=NL;k++){
  const y=k*LV, top=(k===NL);
  for(let i=0;i<10;i++){
    const x0=XS[i], x1=XS[i+1], xc=(x0+x1)/2;
    pipes.push([[x0,y-0.06,ZO],[x1,y-0.06,ZO]]);
    pipes.push([[x0,y-0.06,ZI],[x1,y-0.06,ZI]]);
    if(!(top && i===7)){                                // 危険①：最上段スパン7は手すり・中桟なし
      pipes.push([[x0,y+0.9,ZO],[x1,y+0.9,ZO]]);
      pipes.push([[x0,y+0.45,ZO],[x1,y+0.45,ZO]]);
    }
    const upDir = i%2===0;
    pipes.push([[x0,upDir?y-LV:y,ZO-0.05],[x1,upDir?y:y-LV,ZO-0.05]]); // 筋かい
    for(const zc of [-0.25,0.25]){
      if(i===1 && zc<0) continue;                       // 危険②：開口部
      const it={pos:[xc,y-0.02,zc],size:[1.76,0.04,0.48]};
      if(top){ if(i===6 && zc>0) continue; planksTop.push(it); }   // 危険④：浮いた床板は別メッシュ
      else planksLow.push(it);
    }
    if(top && i!==7) toes.push({pos:[xc,y+0.075,ZO+0.03],size:[1.78,0.15,0.02]});
  }
  for(const x of XS) pipes.push([[x,y-0.06,ZO],[x,y-0.06,ZI]]);
}
for(const x of [-9,9]){ pipes.push([[x,H+0.9,ZO],[x,H+0.9,ZI]]); pipes.push([[x,H+0.45,ZO],[x,H+0.45,ZI]]); }
pipes.push([[-9,H+2.0,ZO],[9,H+2.0,ZO]]); pipes.push([[-9,H+2.0,ZI],[9,H+2.0,ZI]]);

function buildPipes(list,r,mat){
  const im=new THREE.InstancedMesh(new THREE.CylinderGeometry(r,r,1,8,1,true),mat,list.length);
  const m=new THREE.Matrix4(), q=new THREE.Quaternion();
  list.forEach(([a,b],i)=>{ const A=V(a),B=V(b),d=B.clone().sub(A),len=d.length();
    q.setFromUnitVectors(UP,d.normalize()); m.compose(A.clone().add(B).multiplyScalar(0.5),q,new THREE.Vector3(1,len,1)); im.setMatrixAt(i,m); });
  im.instanceMatrix.needsUpdate=true; im.computeBoundingSphere(); return im;
}
function buildBoxes(list,mat){
  const im=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),mat,list.length);
  const m=new THREE.Matrix4(), q=new THREE.Quaternion();
  list.forEach((it,i)=>{ m.compose(V(it.pos),q,V(it.size)); im.setMatrixAt(i,m); });
  im.instanceMatrix.needsUpdate=true; im.computeBoundingSphere(); return im;
}
const pipeMesh=buildPipes(pipes,0.0243,matPipe); scene.add(pipeMesh);
const lowPlankMesh=buildBoxes(planksLow,matPlank); scene.add(lowPlankMesh);
const topPlankMesh=buildBoxes(planksTop,matPlank); scene.add(topPlankMesh);
const toeMesh=buildBoxes(toes,matToe); scene.add(toeMesh);
pickWorld.push(pipeMesh,topPlankMesh,toeMesh,lowPlankMesh); rayTargets.push(topPlankMesh,pipeMesh);

// 親綱
{ const rope=new THREE.Mesh(new THREE.CylinderGeometry(0.009,0.009,18,6),M(0xe8c547));
  rope.rotation.z=Math.PI/2; rope.position.set(0,H+1.85,ZO+0.04); scene.add(rope); pickWorld.push(rope); }

// 危険④：浮いた床板
const liftPlank=new THREE.Mesh(new THREE.BoxGeometry(1.76,0.04,0.48),matPlank);
liftPlank.position.set(2.7,H-0.02+0.035,0.25+0.07); liftPlank.rotation.set(-0.03,0,0.055);
scene.add(liftPlank); pickWorld.push(liftPlank); rayTargets.push(liftPlank);

// 危険⑤：脚立
const ladder=new THREE.Group(); ladder.position.set(-2.9,H,-0.22);
{ const m=M(0xcdd2d9), hg=1.35, sp=0.38;
  for(const s of [-0.2,0.2]){ bar([-sp,0,s],[0,hg,s],0.04,m,ladder); bar([sp,0,s],[0,hg,s],0.04,m,ladder); }
  for(const h of [0.34,0.68,1.02]){ const st=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.025,0.44),m); st.position.set(-sp*(1-h/hg),h,0); ladder.add(st); }
  const tp=new THREE.Mesh(new THREE.BoxGeometry(0.24,0.03,0.46),m); tp.position.set(0,hg,0); ladder.add(tp); }
scene.add(ladder); pickWorld.push(ladder); rayTargets.push(ladder);

// 危険⑥：足元の資材

// ================= 効果音 =================
let actx=null, master=null;
function initAudio(){
  try{
    if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)(); master=actx.createGain(); master.gain.value=0.9; master.connect(actx.destination); startWind(); }
    if(actx.state==='suspended') actx.resume();
  }catch(e){ console.warn(e); }
}
function noiseBuffer(sec,brown){
  const n=Math.floor(actx.sampleRate*sec), b=actx.createBuffer(1,n,actx.sampleRate), d=b.getChannelData(0); let last=0;
  for(let i=0;i<n;i++){ const w=Math.random()*2-1; if(brown){ last=(last+0.02*w)/1.02; d[i]=last*3.5; } else d[i]=w; }
  return b;
}
function startWind(){
  const src=actx.createBufferSource(); src.buffer=noiseBuffer(4,true); src.loop=true;
  const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=650;
  const g=actx.createGain(); g.gain.value=0.2;
  const lfo=actx.createOscillator(); lfo.frequency.value=0.12; const lg=actx.createGain(); lg.gain.value=0.12;
  lfo.connect(lg).connect(g.gain); src.connect(f).connect(g).connect(master); src.start(); lfo.start();
}
function tone(freq,dur,{type='sine',vol=0.2,delay=0,slide=0}={}){
  if(!actx) return; const t=actx.currentTime+delay;
  const o=actx.createOscillator(); o.type=type; o.frequency.setValueAtTime(freq,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  const g=actx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(master); o.start(t); o.stop(t+dur+0.05);
}
const sfx={
  ok(){ tone(784,0.15,{vol:0.25}); tone(1175,0.28,{vol:0.25,delay:0.12}); },
  ng(){ tone(180,0.3,{type:'square',vol:0.06}); },
  tick(){ tone(1000,0.06,{vol:0.12}); },
  clear(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.3,{vol:0.2,delay:i*0.12})); },
  whoosh(){ if(!actx) return; const s=actx.createBufferSource(); s.buffer=noiseBuffer(2,false);
    const f=actx.createBiquadFilter(); f.type='bandpass'; f.Q.value=0.8; const t=actx.currentTime;
    f.frequency.setValueAtTime(300,t); f.frequency.exponentialRampToValueAtTime(2500,t+1.5);
    const g=actx.createGain(); g.gain.setValueAtTime(0.001,t); g.gain.exponentialRampToValueAtTime(0.45,t+1.4); g.gain.exponentialRampToValueAtTime(0.001,t+1.7);
    s.connect(f).connect(g).connect(master); s.start(t); s.stop(t+1.8); },
  thud(){ tone(90,0.7,{vol:0.9,slide:28}); tone(55,0.9,{type:'triangle',vol:0.6,slide:25}); },
};

const tweens=[];

function updateTweens(dt){
  for(let i=tweens.length-1;i>=0;i--){ const tw=tweens[i]; tw.t+=dt; const k=Math.min(1,tw.t/tw.dur); tw.fn(k); if(k>=1){ tweens.splice(i,1); tw.res(); } }
}

let pcYaw=0, pcPitch=-0.3;
const headPos=()=>camera.getWorldPosition(new THREE.Vector3());
function alignRig(target,yaw,pitch=-0.3){
  if(renderer.xr.isPresenting){
    const d=new THREE.Vector3(); camera.getWorldDirection(d);
    rig.rotation.y += yaw-Math.atan2(-d.x,-d.z);
    rig.position.y = target.y; rig.updateMatrixWorld(true);
    const p=headPos(); rig.position.x+=target.x-p.x; rig.position.z+=target.z-p.z;
  } else {
    rig.position.copy(target); rig.rotation.y=0; pcYaw=yaw; pcPitch=pitch;
    camera.rotation.set(pcPitch,pcYaw,0,'YXZ');
  }
}

function allowed(x,z){
  if(x<-8.6||x>8.6||z<-0.35||z>0.42) return false;
  for(const [x0,x1,z0,z1] of BLOCKS) if(x>x0&&x<x1&&z>z0&&z<z1) return false;
  return true;
}
function moveHead(d){
  const p=headPos();
  if(!allowed(p.x,p.z)){ rig.position.x+=d.x; rig.position.z+=d.z; return; }
  for(const [dx,dz] of [[d.x,d.z],[d.x,0],[0,d.z]]){ if(allowed(p.x+dx,p.z+dz)){ rig.position.x+=dx; rig.position.z+=dz; return; } }
}
function snapTurn(a){ const p0=headPos(); rig.rotation.y+=a; rig.updateMatrixWorld(true); const p1=headPos(); rig.position.x+=p0.x-p1.x; rig.position.z+=p0.z-p1.z; }

// ================= ゲーム進行 =================
let state='idle', timeLeft=TIME_LIMIT, found=0, wrong=0, lastSec=-1;
function resetHazards(){
  HAZ.forEach(h=>h.found=false); found=0; wrong=0; wrongMarks.length=0;
  while(markers.children.length) markers.remove(markers.children[0]);
}
function enterIntro(){
  resetHazards(); state='intro'; intro.mesh.visible=true; result.mesh.visible=false; hud.mesh.visible=false;
  hideCaption(); black.material.opacity=0; alignRig(START,0);
}
function startGame(){
  resetHazards(); timeLeft=TIME_LIMIT; lastSec=-1; state='play';
  intro.mesh.visible=false; result.mesh.visible=false; hud.mesh.visible=true; drawHud();
}
function endGame(reason){ if(state!=='play') return; state='fall'; hud.mesh.visible=false; runEnding(reason); }
function showResult(reason,fell){ lastResult={reason,fell}; drawResult(); result.mesh.visible=true; state='result'; }

function discover(h,src){
  h.found=true; found++;
  const box=new THREE.BoxGeometry(...h.size);
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(box),new THREE.LineBasicMaterial({color:0x22ff66,depthTest:false,transparent:true}));
  e.position.copy(h.hit.position); e.renderOrder=40; markers.add(e);
  const f=new THREE.Mesh(box,new THREE.MeshBasicMaterial({color:0x22ff66,transparent:true,opacity:0.15,depthWrite:false,fog:false}));
  f.position.copy(h.hit.position); markers.add(f);
  const l=makeLabel(`危険発見！ ${h.short}`,'#16a34a'); l.position.set(h.center[0],h.center[1]+h.size[1]/2+0.22,h.center[2]); markers.add(l);
  sfx.ok(); pulse(src,0.8,80); drawHud();
  if(found===HAZ.length) endGame('all');
}
function markWrong(p,src){
  wrong++; const s=makeLabel('×','#dc2626',0.14); s.position.copy(p); markers.add(s); wrongMarks.push({s,t:0});
  sfx.ng(); pulse(src,0.3,40);
}
function pulse(src,i,d){ try{ src?.gamepad?.hapticActuators?.[0]?.pulse(i,d); }catch(e){} }

function handlePick(rc,src){
  const bh=rc.intersectObjects(activeButtonMeshes(),false)[0];
  if(bh){ bh.object.userData.btn.onClick(); return; }
  if(state!=='play') return;
  const hz=rc.intersectObjects(hitBoxes,false)[0];
  const wh=rc.intersectObjects(pickWorld,true)[0];
  if(hz && (!wh || hz.distance<=wh.distance+0.6)){ const h=hz.object.userData.haz; if(!h.found) discover(h,src); return; }
  if(wh && wh.distance<40) markWrong(wh.point,src);
}

async function runEnding(reason){
  const missed=HAZ.filter(h=>!h.found);
  if(missed.length===0){
    sfx.clear(); showCaption('全ての危険を発見！','指差し呼称「足場の安全、ヨシ！」');
    await wait(2.8); hideCaption(); await fade(0,1,0.5);
    alignRig(START,0); showResult(reason,null); await fade(1,0,0.6); return;
  }
  const h=missed[Math.floor(Math.random()*missed.length)];
  showCaption(reason==='timeup'?'時間切れ！':'終了',`見落とした危険：${h.name}\nもしこのまま作業を続けていたら…`);
  await wait(3.2);
  await fade(0,1,0.5); hideCaption();
  const from=V(h.fallFrom), to=V(h.fallTo), dir=to.clone().sub(from); dir.y=0;
  alignRig(from,Math.atan2(-dir.x,-dir.z),-0.55);
  await fade(1,0,0.5);
  showCaption('',h.fallText);
  await wait(2.0); hideCaption();
  if(fallEffect){
    sfx.whoosh();
    const p0=rig.position.clone();
    await tween(0.4,k=>{ rig.position.copy(p0).addScaledVector(dir,k*k); });
    const p1=rig.position.clone(), dn=dir.clone().normalize();
    await tween(1.1,k=>{ const t=k*1.1;
      rig.position.set(p1.x+dn.x*0.6*t, p1.y-4.9*t*t, p1.z+dn.z*0.6*t);
      setVignette(1,0.7*(1-k)); black.material.opacity=smooth(0.2,0.9,k); });
  } else {
    await fade(0,1,0.6);
  }
  black.material.opacity=1; sfx.thud();
  if(renderer.xr.isPresenting) for(const s of renderer.xr.getSession().inputSources) pulse(s,1.0,250);
  await wait(0.9);
  showCaption('墜落…','建設業の死亡災害で最も多いのが「墜落・転落」です。\nほんの一瞬の見落としが、命に関わります。');
  await wait(3.8); hideCaption(); setVignette(0,0.6);
  alignRig(START,0); showResult(reason,h);
  await fade(1,0,0.8);
}

// ================= VRコントローラー =================
const controllers=[];
const factory=new XRControllerModelFactory();
const rc=new THREE.Raycaster();
const tmpM=new THREE.Matrix4();
function rayFromController(c){ tmpM.identity().extractRotation(c.matrixWorld); rc.ray.origin.setFromMatrixPosition(c.matrixWorld); rc.ray.direction.set(0,0,-1).applyMatrix4(tmpM); }
for(let i=0;i<2;i++){
  const c=renderer.xr.getController(i);
  const lineGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(0,0,-1)]);
  const line=new THREE.Line(lineGeo,new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.8}));
  line.scale.z=5; line.visible=false; c.add(line);
  const ret=new THREE.Mesh(new THREE.SphereGeometry(0.012,10,8),new THREE.MeshBasicMaterial({color:0xffee55,depthTest:false,fog:false}));
  ret.renderOrder=45; ret.visible=false; c.add(ret);
  c.userData={line,ret,src:null};
  c.addEventListener('connected',e=>{ c.userData.src=e.data; line.visible=e.data.targetRayMode==='tracked-pointer'; });
  c.addEventListener('disconnected',()=>{ c.userData.src=null; line.visible=false; ret.visible=false; });
  c.addEventListener('selectstart',()=>{ initAudio(); rayFromController(c); handlePick(rc,c.userData.src); });
  rig.add(c); controllers.push(c);
  const grip=renderer.xr.getControllerGrip(i); grip.add(factory.createControllerModel(grip)); rig.add(grip);
}
function updateVRPointers(hoverSet){
  for(const c of controllers){
    const u=c.userData; if(!u.src||!u.line.visible) continue;
    rayFromController(c);
    let dist=5, hit=false;
    const bh=rc.intersectObjects(activeButtonMeshes(),false)[0];
    if(bh){ hoverSet.add(bh.object.userData.btn); dist=bh.distance; hit=true; u.line.material.color.set(0xfde047); }
    else { u.line.material.color.set(0xffffff); const wh=rc.intersectObjects(rayTargets,true)[0]; if(wh&&wh.distance<20){ dist=wh.distance; hit=true; } }
    u.line.scale.z=dist; u.ret.position.set(0,0,-dist); u.ret.scale.setScalar(Math.max(1,dist*0.6)); u.ret.visible=hit;
  }
}

// ================= PC操作 =================
const canvas=renderer.domElement;
const keys={};
addEventListener('keydown',e=>{ keys[e.code]=true; });
addEventListener('keyup',e=>{ keys[e.code]=false; });
let pDown=null, pcHover=null;
const ndc=new THREE.Vector2();
function setRayFromMouse(e){ ndc.set((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1); rc.setFromCamera(ndc,camera); }
canvas.addEventListener('pointerdown',e=>{ if(renderer.xr.isPresenting) return; pDown={x:e.clientX,y:e.clientY,moved:false}; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove',e=>{
  if(renderer.xr.isPresenting) return;
  if(pDown){
    if(Math.abs(e.clientX-pDown.x)+Math.abs(e.clientY-pDown.y)>5) pDown.moved=true;
    if(pDown.moved){ pcYaw-=e.movementX*0.0045; pcPitch=Math.max(-1.45,Math.min(1.2,pcPitch-e.movementY*0.0045)); }
  } else {
    setRayFromMouse(e); const bh=rc.intersectObjects(activeButtonMeshes(),false)[0];
    pcHover=bh?bh.object.userData.btn:null; canvas.style.cursor=pcHover?'pointer':'crosshair';
  }
});
canvas.addEventListener('pointerup',e=>{ if(renderer.xr.isPresenting) return; if(pDown&&!pDown.moved){ initAudio(); setRayFromMouse(e); handlePick(rc,null); } pDown=null; });
canvas.style.cursor='crosshair';

// ================= 入力処理 =================
let snapCool=0, vigAmt=0;
function handleInput(dt){
  const xr=renderer.xr.isPresenting;
  const canMove=(state==='intro'||state==='play'||state==='result');
  let mx=0, mz=0;
  if(xr){
    for(const src of renderer.xr.getSession().inputSources){
      const gp=src.gamepad; if(!gp) continue;
      const x=(gp.axes.length>=4?gp.axes[2]:gp.axes[0])||0, y=(gp.axes.length>=4?gp.axes[3]:gp.axes[1])||0;
      if(src.handedness==='left'){ if(Math.abs(x)>0.15) mx=x; if(Math.abs(y)>0.15) mz=y; }
      else if(src.handedness==='right' && canMove && snapCool<=0 && Math.abs(x)>0.7){ snapTurn(x>0?-Math.PI/6:Math.PI/6); snapCool=0.35; }
    }
  } else {
    if(keys.KeyW||keys.ArrowUp) mz-=1; if(keys.KeyS||keys.ArrowDown) mz+=1;
    if(keys.KeyA||keys.ArrowLeft) mx-=1; if(keys.KeyD||keys.ArrowRight) mx+=1;
  }
  snapCool-=dt;
  const moving=canMove&&(mx!==0||mz!==0);
  if(moving){
    const fwd=new THREE.Vector3(); camera.getWorldDirection(fwd); fwd.y=0; fwd.normalize();
    const right=new THREE.Vector3(-fwd.z,0,fwd.x);
    const d=fwd.multiplyScalar(-mz).addScaledVector(right,mx); if(d.lengthSq()>1) d.normalize();
    moveHead(d.multiplyScalar(1.4*dt));
  }
  if(state!=='fall'){ vigAmt+=(((moving&&xr)?0.9:0)-vigAmt)*Math.min(1,dt*8); setVignette(vigAmt,0.55); }
  if(!xr) camera.rotation.set(pcPitch,pcYaw,0,'YXZ');
}

// ================= メインループ =================
const clock=new THREE.Clock();
let frame=0, needAlign=0;
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),0.1); frame++;
  if(needAlign && renderer.xr.isPresenting && frame>needAlign){ alignRig(START,0); needAlign=0; }
  updateTweens(dt);
  handleInput(dt);
  if(state==='play'){
    timeLeft-=dt; const s=Math.ceil(timeLeft);
    if(s!==lastSec){ lastSec=s; drawHud(); if(s<=10&&s>0) sfx.tick(); }
    if(timeLeft<=0) endGame('timeup');
  }
  for(let i=wrongMarks.length-1;i>=0;i--){ const w=wrongMarks[i]; w.t+=dt; w.s.material.opacity=Math.max(0,1-w.t/1.2); if(w.t>1.2){ markers.remove(w.s); wrongMarks.splice(i,1); } }
  black.visible=black.material.opacity>0.001;
  const hoverSet=new Set();
  if(renderer.xr.isPresenting) updateVRPointers(hoverSet); else if(pcHover) hoverSet.add(pcHover);
  for(const b of buttons) b.setHover(hoverSet.has(b));
  renderer.render(scene,camera);
});
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

// ================= 開始ボタン =================
const overlay=document.getElementById('overlay'), statusEl=document.getElementById('status'), vrBtn=document.getElementById('vrBtn');
document.getElementById('fallOpt').addEventListener('change',e=>{ fallEffect=e.target.checked; btnFall.draw(); });
if('xr' in navigator){
  navigator.xr.isSessionSupported('immersive-vr').then(ok=>{
    if(ok){ vrBtn.disabled=false; statusEl.textContent=''; }
    else statusEl.textContent='この端末・ブラウザはVR非対応です。「PCで開始」をお使いください。';
  }).catch(()=>{ statusEl.textContent='VR対応を確認できませんでした。'; });
} else {
  statusEl.textContent = window.isSecureContext ? 'このブラウザはWebXR非対応です（PC体験は可能）。' : 'VRで使うにはHTTPSで公開したURLから開いてください（PC体験は可能）。';
}
vrBtn.addEventListener('click',async()=>{
  initAudio();
  try{
    const session=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor','hand-tracking']});
    await renderer.xr.setSession(session);
    session.addEventListener('end',()=>{
      tweens.length=0; black.material.opacity=0; setVignette(0,0.6); hideCaption();
      camera.position.set(0,1.6,0); camera.quaternion.identity(); rig.rotation.y=0; rig.position.copy(START);
      state='idle'; hud.mesh.visible=false; overlay.style.display='flex';
    });
    overlay.style.display='none'; document.getElementById('pcHelp').style.display='none';
    enterIntro(); needAlign=frame+5;
  }catch(e){ statusEl.textContent='VRを開始できませんでした：'+e.message; }
});
document.getElementById('pcBtn').addEventListener('click',()=>{
  initAudio(); overlay.style.display='none'; document.getElementById('pcHelp').style.display='block'; enterIntro();
});
</script>
