<div id="overlay"><div class="card">
  <h1>KY（危険予知）体験VR〈試作〉</h1>
  <p>建設現場の危険を、VRの中で<b>指差して見つける</b>体験です。開始後の画面で体験するシナリオを選びます。</p>
  <ul>
    <li><b>Meta Quest</b>：「VRで開始」→ トリガー＝指差し／左スティック＝移動／右スティック＝向き変更</li>

  <p style="margin:10px 0 0"><label><input type="checkbox" id="fxOpt" checked> 疑似体験の演出あり（オフにすると暗転のみ）</label></p>

</div></div>

<script type="module">
import * as THREE from 'three';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

/* =====================================================================
   共通エンジン
   ・シナリオを追加するときは、下の「シナリオ定義」に1つ追加し、
     SCENARIOS 配列に登録するだけでメニューに表示されます。
   ===================================================================== */
const FONT = '"Noto Sans JP","Noto Sans CJK JP","Hiragino Sans","Yu Gothic","Meiryo",sans-serif';
let effectOn = true;
// URL指定：?s=kanden でそのシナリオから開始、&solo=1 でシナリオ選択メニューを出さない（項目ごとの専用URL用）
const URLP = new URLSearchParams(location.search);
const SOLO = URLP.get('solo')==='1';
const PENALTY = 3;   // お手つき（危険でない所を指した）ときに減る秒数

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const rig = new THREE.Group(); scene.add(rig);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.05, 800);
camera.position.set(0,1.6,0);
rig.add(camera);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a60, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.8); sun.position.set(-30,60,-40); scene.add(sun);

// ---------- ユーティリティ ----------
function canvasTex(w,h,draw,repeat){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8;
  if(repeat){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(repeat[0],repeat[1]); }
  return t;
}
const M = (c,extra={}) => new THREE.MeshLambertMaterial({color:c,...extra});
const V = a => a.isVector3 ? a.clone() : new THREE.Vector3(a[0],a[1],a[2]);
const UP = new THREE.Vector3(0,1,0);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function bar(a,b,t,mat,parent){
  const A=V(a),B=V(b),d=B.clone().sub(A),len=d.length();
  const m=new THREE.Mesh(new THREE.BoxGeometry(t,len,t),mat);
  m.position.copy(A).add(B).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(UP,d.normalize());
  parent.add(m); return m;
}
function box(parent,w,h,d,mat,x,y,z){ const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); b.position.set(x,y,z); parent.add(b); return b; }
function cord(parent,pts,color=0x1f1f1f,r=0.012){
  const c=new THREE.CatmullRomCurve3(pts.map(V));
  const m=new THREE.Mesh(new THREE.TubeGeometry(c,Math.max(12,pts.length*14),r,6,false),M(color));
  parent.add(m); return m;
}
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function wrap(g,text,maxW){
  const lines=[]; let line='';
  for(const ch of text){
    if(ch==='\n'){ lines.push(line); line=''; continue; }
    const t=line+ch;
    if(g.measureText(t).width>maxW && line){ lines.push(line); line=ch; } else line=t;
  }
  if(line) lines.push(line);
  return lines;
}
function para(g,str,x,y,size,color,maxW,lh,draw,bold){
  g.font=`${bold?'bold ':''}${size}px ${FONT}`;
  const lines=wrap(g,str,maxW);
  if(draw){ g.fillStyle=color; g.textBaseline='top'; g.textAlign='left'; lines.forEach((l,i)=>g.fillText(l,x,y+i*size*lh)); }
  return y+lines.length*size*lh;
}
const smooth=(a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
function buildPipes(list,r,mat){
  const im=new THREE.InstancedMesh(new THREE.CylinderGeometry(r,r,1,8,1,true),mat,list.length);
  const m=new THREE.Matrix4(), q=new THREE.Quaternion();
  list.forEach(([a,b],i)=>{ const A=V(a),B=V(b),d=B.clone().sub(A),len=d.length();
    q.setFromUnitVectors(UP,d.normalize()); m.compose(A.clone().add(B).multiplyScalar(0.5),q,new THREE.Vector3(1,len,1)); im.setMatrixAt(i,m); });
  im.instanceMatrix.needsUpdate=true; im.computeBoundingSphere(); return im;
}
function buildBoxes(list,mat){
  const im=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),mat,list.length);
  const m=new THREE.Matrix4(), q=new THREE.Quaternion();
  list.forEach((it,i)=>{ m.compose(V(it.pos),q,V(it.size)); im.setMatrixAt(i,m); });
  im.instanceMatrix.needsUpdate=true; im.computeBoundingSphere(); return im;
}
function noiseFill(g,w,h,base,n,rgb,a){
  g.fillStyle=base; g.fillRect(0,0,w,h);
  for(let i=0;i<n;i++){ const v=Math.random(); g.fillStyle=`rgba(${rgb(v)},${a})`; g.fillRect(Math.random()*w,Math.random()*h,2,2); }
}
const TEX={
  ground:()=>canvasTex(256,256,(g,w,h)=>noiseFill(g,w,h,'#8a7657',2500,v=>{const c=100+v*60|0;return `${c},${c-20},${c-50}`;},0.5),[150,150]),
  pad:(r)=>canvasTex(256,256,(g,w,h)=>{ noiseFill(g,w,h,'#9a9a96',1500,v=>{const c=130+v*50|0;return `${c},${c},${c}`;},0.5); g.strokeStyle='#7d7d79'; g.lineWidth=3; g.strokeRect(0,0,w,h); },r),
  concrete:(r,base='#a9a69f')=>canvasTex(256,256,(g,w,h)=>{ noiseFill(g,w,h,base,3000,v=>{const c=140+v*50|0;return `${c},${c-2},${c-6}`;},0.35);
    g.fillStyle='rgba(80,80,80,0.25)'; for(let i=0;i<4;i++){ g.beginPath(); g.arc(Math.random()*w,Math.random()*h,2,0,7); g.fill(); } },r),
  plank:()=>canvasTex(512,128,(g,w,h)=>{ g.fillStyle='#8f969d'; g.fillRect(0,0,w,h); g.fillStyle='#6b7178';
    for(let x=14;x<w;x+=22) for(let y=14;y<h;y+=22){ g.beginPath(); g.arc(x,y,5,0,Math.PI*2); g.fill(); }
    g.strokeStyle='#5d636a'; g.lineWidth=6; g.strokeRect(0,0,w,h); }),
  building:(r)=>canvasTex(512,512,(g,w,h)=>{ noiseFill(g,w,h,'#bdb8ae',3000,v=>{const c=160+v*40|0;return `${c},${c-4},${c-12}`;},0.4);
    for(let row=0;row<2;row++){ g.fillStyle='#a6a197'; g.fillRect(0,row*256,w,16);
      for(let c=0;c<2;c++){ g.fillStyle='#46525e'; g.fillRect(c*256+44,row*256+70,168,130); g.fillStyle='#5d6b78'; g.fillRect(c*256+44,row*256+70,168,10);} } },r),
  label:(text,{w=512,h=160,bg='#fff',fg='#111',size=64,border=null}={})=>canvasTex(w,h,(g)=>{
    g.fillStyle=bg; g.fillRect(0,0,w,h); if(border){ g.strokeStyle=border; g.lineWidth=12; g.strokeRect(6,6,w-12,h-12); }
    g.fillStyle=fg; g.font=`bold ${size}px ${FONT}`; g.textAlign='center'; g.textBaseline='middle';
    const ls=text.split('\n'); ls.forEach((l,i)=>g.fillText(l,w/2,h/2+(i-(ls.length-1)/2)*size*1.15)); }),
};
function addFarCity(g){
  const n=70; const im=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshLambertMaterial({color:0xffffff}), n);
  const m=new THREE.Matrix4(), q=new THREE.Quaternion(), col=new THREE.Color();
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, r=80+Math.random()*180;
    const w=10+Math.random()*25, h=8+Math.random()*55, d=10+Math.random()*25;
    q.setFromAxisAngle(UP,Math.random()*Math.PI);
    m.compose(new THREE.Vector3(Math.cos(a)*r,h/2,Math.sin(a)*r),q,new THREE.Vector3(w,h,d));
    im.setMatrixAt(i,m); const v=0.6+Math.random()*0.3; im.setColorAt(i,col.setRGB(v,v,v*1.03));
  }
  im.instanceColor.needsUpdate=true; g.add(im);
}

// 作業員（前向き＝-Z）。hand:[x,y,z]＝手の位置（作業員基準、xは左右反転）
function makeWorker(o={}){
  const g=new THREE.Group();
  const wear=M(o.wear||0x3b5b8c), pants=M(o.pants||0x2b3a55), skin=M(0xe0b48a), hm=M(o.helmet||0xffffff), boot=M(0x222222);
  const hz=M(0xff7a00);
  for(const sx of [-0.1,0.1]){ box(g,0.14,0.82,0.16,pants,sx,0.41,0); box(g,0.15,0.08,0.26,boot,sx,0.04,-0.03);
    if(o.harness) box(g,0.17,0.05,0.19,hz,sx,0.7,0); }
  const up=new THREE.Group(); up.position.set(0,0.82,0); up.rotation.x=o.lean||0; g.add(up);
  box(up,0.42,0.6,0.24,wear,0,0.3,0);
  const head=new THREE.Group(); head.position.set(0,0.76,0); head.rotation.x=o.headUp||0; up.add(head);
  head.add(new THREE.Mesh(new THREE.SphereGeometry(0.11,16,12),skin));
  const hel=new THREE.Mesh(new THREE.SphereGeometry(0.135,16,8,0,Math.PI*2,0,Math.PI/2),hm); hel.position.y=0.03; head.add(hel);
  const eyeM=M(0x111111); for(const ex of [-0.04,0.04]){ const e=new THREE.Mesh(new THREE.SphereGeometry(0.014,8,6),eyeM); e.position.set(ex,0.0,-0.1); head.add(e); }
  if(o.glasses){
    const gm=new THREE.MeshLambertMaterial({color:0x7dd3fc,transparent:true,opacity:0.75});
    const gl=box(head,0.21,0.06,0.03,gm,0,0,-0.115);
    const frame=box(head,0.23,0.075,0.02,M(0x1f2937),0,0,-0.105);
    if(o.glasses==='up'){ for(const m of [gl,frame]){ m.position.y=0.115; m.position.z-=0.03; m.rotation.x=-0.6; } }
  }
  if(o.harness){
    box(up,0.44,0.06,0.26,hz,0,0.06,0);
    bar([-0.12,0.58,-0.125],[-0.08,0.08,-0.125],0.035,hz,up); bar([0.12,0.58,-0.125],[0.08,0.08,-0.125],0.035,hz,up);
    bar([-0.12,0.58,0.125],[0.0,0.45,0.125],0.035,hz,up); bar([0.12,0.58,0.125],[0.0,0.45,0.125],0.035,hz,up);
  }
  up.updateMatrix(); const inv=up.matrix.clone().invert();
  for(const sx of [-1,1]){
    const sh=[0.24*sx,0.55,0];
    const hand = (o.hand && !(o.oneHand && sx<0)) ? V([o.hand[0]*sx,o.hand[1],o.hand[2]]).applyMatrix4(inv).toArray() : [0.27*sx,0.0,0.02];
    bar(sh,hand,0.1,wear,up);
    if(o.gloves){ const gl=box(up,0.1,0.12,0.06,gunteMat(),hand[0],hand[1],hand[2]); gl.rotation.x=0.3; }
  }
  const dring=V([0,0.5,0.13]).applyMatrix4(up.matrix);
  const lan=M(0x1f1f1f), hookM=M(0x9ca3af);
  if(o.lanyard==='floor'){
    const p1=[0.12,0.7,0.32], p2=[0.32,0.02,0.4];
    bar(dring.toArray(),p1,0.025,lan,g); bar(p1,p2,0.025,lan,g);
    const hk=new THREE.Mesh(new THREE.TorusGeometry(0.045,0.012,8,16,Math.PI*1.6),hookM); hk.rotation.x=Math.PI/2; hk.position.set(...p2); g.add(hk);
  } else if(o.lanyard==='hooked'){
    const p1=[0.25,1.6,0.1], p2=o.hookTo;
    bar(dring.toArray(),p1,0.025,lan,g); bar(p1,p2,0.025,lan,g);
    const hk=new THREE.Mesh(new THREE.TorusGeometry(0.045,0.012,8,16,Math.PI*1.6),hookM); hk.position.set(...p2); g.add(hk);
  }
  return g;
}

// ---------- 現在のシナリオの状態 ----------
let cur=null, worldGroup=null, pickWorld=[], rayTargets=[], hazards=[], hitBoxes=[];
const pick=(...o)=>pickWorld.push(...o);
const ray=(...o)=>rayTargets.push(...o);
const both=(...o)=>{ pick(...o); ray(...o); };

/* =====================================================================
   資材・小物ライブラリ（ひと目で何か分かるよう、印刷・ラベル付き）
   ===================================================================== */
const _tc=new Map();
function ptex(key,w,h,draw){ let t=_tc.get(key); if(!t){ t=canvasTex(w,h,draw); _tc.set(key,t); } return t; }
function txt(c,t,x,y,size,color='#111',bold=true,align='center'){ c.font=`${bold?'bold ':''}${size}px ${FONT}`; c.fillStyle=color; c.textAlign=align; c.textBaseline='middle'; c.fillText(t,x,y); }
function grain(c,w,h,base,line){ c.fillStyle=base; c.fillRect(0,0,w,h); c.strokeStyle=line; c.globalAlpha=0.35;
  for(let i=0;i<40;i++){ c.lineWidth=1+Math.random()*2; const y=Math.random()*h; c.beginPath(); c.moveTo(0,y); c.bezierCurveTo(w*0.3,y+Math.random()*10-5,w*0.6,y+Math.random()*10-5,w,y+Math.random()*6-3); c.stroke(); }
  c.globalAlpha=1; }
const TM=t=>new THREE.MeshLambertMaterial({map:t});
const hex=c=>'#'+c.toString(16).padStart(6,'0');
// 面ごとに模様を貼れる箱（top=上面, side=前後, end=左右）
function pbox(w,h,d,o={}){
  const mk=v=>v==null?M(o.color??0x999999):(typeof v==='number'?M(v):TM(v));
  const side=o.side, end=o.end??o.side, top=o.top??o.side;
  return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),[mk(end),mk(end),mk(top),M(o.bottom??0x666666),mk(side),mk(o.back??side)]);
}
const KRAFT='#cfae7c';
const P={
  pallet(){ const g=new THREE.Group(); for(let i=0;i<5;i++) box(g,1.1,0.025,0.16,M(0xb08a5a),0,0.125,-0.44+i*0.22); for(const z of [-0.45,0,0.45]) box(g,1.1,0.1,0.09,M(0x9a7748),0,0.05,z); return g; },
  bag(kind='cement'){
    const K={cement:['普通ポルトランド','セメント 25kg','#c62828'],mortar:['既調合モルタル','25kg','#2e7d32'],sand:['けい砂','20kg','#1565c0'],plaster:['しっくい','20kg','#6a1b9a'],tile:['タイル接着剤','20kg','#ef6c00']}[kind];
    const top=ptex('bag'+kind,256,384,(c,w,h)=>{ c.fillStyle=KRAFT; c.fillRect(0,0,w,h); c.fillStyle=K[2]; c.fillRect(0,40,w,70); c.fillRect(0,h-60,w,22);
      txt(c,K[0],w/2,75,30,'#fff'); txt(c,K[1],w/2,190,44,K[2]); c.strokeStyle='rgba(0,0,0,0.15)'; c.lineWidth=3; c.strokeRect(6,6,w-12,h-12); });
    const side=ptex('bags'+kind,256,64,(c,w,h)=>{ c.fillStyle=KRAFT; c.fillRect(0,0,w,h); c.fillStyle=K[2]; c.fillRect(0,20,w,16); });
    return pbox(0.42,0.11,0.62,{top,side}); },
  bagStack(kind,layers=3){ const g=P.pallet();
    for(let l=0;l<layers;l++) for(let i=0;i<2;i++){ const b=P.bag(kind); const r=l%2; b.rotation.y=r?Math.PI/2:0; b.position.set(r?0:(i?0.23:-0.23),0.205+l*0.11,r?(i?0.23:-0.23):0); g.add(b); }
    return g; },
  cardboard(w=0.45,h=0.3,d=0.35,label='資材'){
    const top=ptex('cbt',256,256,(c,W,H)=>{ c.fillStyle=KRAFT; c.fillRect(0,0,W,H); c.fillStyle='#e8d3a8'; c.fillRect(W*0.42,0,W*0.16,H); c.strokeStyle='#a8865a'; c.lineWidth=3; c.beginPath(); c.moveTo(0,H/2); c.lineTo(W,H/2); c.stroke(); });
    const side=ptex('cbs'+label,256,192,(c,W,H)=>{ c.fillStyle=KRAFT; c.fillRect(0,0,W,H); c.fillStyle='#e8d3a8'; c.fillRect(0,0,W,18); txt(c,label,W/2,H/2+6,Math.min(58,330/label.length),'#3b2a14'); txt(c,'↑↑',W-30,H-24,24,'#3b2a14'); });
    return pbox(w,h,d,{top,side}); },
  gypsum(n=8){ const g=new THREE.Group();
    const top=ptex('gyt',256,512,(c,W,H)=>{ c.fillStyle='#f1efe8'; c.fillRect(0,0,W,H); txt(c,'石膏ボード',W/2,H*0.42,40,'#1d4ed8'); txt(c,'12.5mm 910×1820',W/2,H*0.52,22,'#1d4ed8',false); c.strokeStyle='#d6d3cc'; c.lineWidth=6; c.strokeRect(0,0,W,H); });
    const side=ptex('gys',256,64,(c,W,H)=>{ c.fillStyle='#e7e5e4'; c.fillRect(0,0,W,H); c.strokeStyle='#bdb8ae'; for(let y=4;y<H;y+=8){ c.beginPath(); c.moveTo(0,y); c.lineTo(W,y); c.stroke(); } });

function buildShell(g,o={}){
  const CH=o.CH||2.8;
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),TM(TEX.ground())); ground.rotation.x=-Math.PI/2; ground.position.y=-0.01; g.add(ground); pick(ground);
  addFarCity(g);

  const ceil=new THREE.Mesh(new THREE.PlaneGeometry(18,5),M(0xd6d3cc)); ceil.rotation.x=Math.PI/2; ceil.position.set(0,CH,-2.5); g.add(ceil); both(ceil);
  const wm=TM(TEX.concrete([3,1],o.wall||'#b8b4ab'));
  const wall=(w,h,d,x,y,z)=>{ const m=box(g,w,h,d,wm,x,y,z); both(m); return m; };
  wall(18.24,CH,0.12,0,CH/2,0.06);
  const bo=o.back;
  if(bo){ const lw=bo.x0+9, rw=9-bo.x1, ow=bo.x1-bo.x0, oc=(bo.x0+bo.x1)/2;
    wall(lw,CH,0.12,-9+lw/2,CH/2,-5.06); wall(rw,CH,0.12,bo.x1+rw/2,CH/2,-5.06); wall(ow,bo.y0,0.12,oc,bo.y0/2,-5.06); wall(ow,CH-bo.y1,0.12,oc,(CH+bo.y1)/2,-5.06);
  } else wall(18,CH,0.12,0,CH/2,-5.06);
  const lo=o.left;
  if(lo){ const a=lo.z0+5, b=-lo.z1, ow=lo.z1-lo.z0, oc=(lo.z0+lo.z1)/2;
    wall(0.12,CH,a,-9.06,CH/2,-5+a/2); wall(0.12,CH,b,-9.06,CH/2,lo.z1+b/2); wall(0.12,lo.y0,ow,-9.06,lo.y0/2,oc); wall(0.12,CH-lo.y1,ow,-9.06,(CH+lo.y1)/2,oc);
    for(const y of [lo.y0,lo.y1]) box(g,0.08,0.06,ow,M(0x6b7280),-9.02,y,oc);
  } else wall(0.12,CH,5,-9.06,CH/2,-2.5);
  wall(0.12,CH,5,9.06,CH/2,-2.5);
  for(const x of [-3,3]){ wall(0.12,CH,1.9,x,CH/2,-4.05); wall(0.12,CH,1.9,x,CH/2,-0.95); wall(0.12,CH-2.1,1.2,x,(CH+2.1)/2,-2.5); }

    box(g,1.2,0.05,0.2,new THREE.MeshBasicMaterial({color:0xfffbe8}),x,CH-0.03,-2.0); }
  (o.names||[]).forEach((t,i)=>{ const s=P.sign(t,{w:1.2,h:0.26}); s.position.set([-6,0,6][i]+((o.signDx||[])[i]||0),CH-0.5,-4.99); g.add(s); });

        await wait(0.15); await fade(0,1,0.25);
      } else if(fx==='stylo'){
        await tween(0.7,()=>spin());
        sfx.bang(); hapticAll(0.5,150);
        await tween(0.25,k=>{ spin(); const e=1-(1-k)*(1-k); gr.position.set(0.08-0.05*e,-0.32+0.12*e,-0.6+0.32*e); gr.rotation.y=Math.PI/2+0.25-1.2*e; gr.rotation.z=0.5*e; setVignette(1,0.7-0.4*e); });
        await wait(0.15); await fade(0,1,0.25);
      } else if(fx==='shock'){
        await tween(0.6,()=>spin());
        await tween(0.3,k=>{ spin(); gr.position.set(0.08,-0.32-0.12*k,-0.6+0.03*k); gr.rotation.x=Math.PI/2+0.5*k; });
        sfx.bang(); hapticAll(0.4,100);
        const parts=burst(gr.position.clone().add(new THREE.Vector3(0,-0.05,0)),0xffe08a);
        await tween(0.3,k=>{ spin(); parts.forEach(p=>p.position.lerpVectors(p.userData.a,p.userData.b,Math.sqrt(k))); });
        sfx.zap(); hapticAll(0.45,300);
        await tween(0.4,k=>{ setVignette(1,0.8*(1-k),0x5a0000); black.material.opacity=smooth(0.35,1,k); });
        clear(parts);
      } else if(fx==='glove'){
        const glove=new THREE.Group(); glove.position.set(-0.14,-0.36,-0.5); camera.add(glove);
        const gm=gunteMat(); gm.depthTest=false;
        const palm=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.03,0.1),gm); palm.renderOrder=9996; glove.add(palm);
        for(let i=0;i<4;i++){ const f=new THREE.Mesh(new THREE.BoxGeometry(0.018,0.02,0.07),gm); f.position.set(-0.03+i*0.02,0,-0.08); f.renderOrder=9996; glove.add(f); }
        glove.rotation.y=-0.5;
        await tween(0.6,()=>spin());
        await tween(0.35,k=>{ spin(); glove.position.set(-0.14+0.18*k,-0.36-0.01*k,-0.5-0.08*k); });
        sfx.bang(); hapticAll(0.6,150);
        drawSplat('blood'); splat.visible=true;
        await tween(0.12,k=>{ splat.material.opacity=k; setVignette(1,0.7-0.3*k); });
        await wait(0.35);
        await fade(0,1,0.4);
        splat.visible=false; splat.material.opacity=0; clear([glove]);
      }
      camera.remove(gr); disposeTree(gr);
      black.material.opacity=1; setVignette(0,0.6);
    },
  };

let actx=null, master=null, windGain=null, humGain=null;
function initAudio(){
  try{
    if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)(); master=actx.createGain(); master.gain.value=0.9; master.connect(actx.destination); startAmbient(); setAmbient(cur?cur.ambient:'none'); }
    if(actx.state==='suspended') actx.resume();
  }catch(e){ console.warn(e); }
}
function noiseBuffer(sec,brown){
  const n=Math.floor(actx.sampleRate*sec), b=actx.createBuffer(1,n,actx.sampleRate), d=b.getChannelData(0); let last=0;
  for(let i=0;i<n;i++){ const w=Math.random()*2-1; if(brown){ last=(last+0.02*w)/1.02; d[i]=last*3.5; } else d[i]=w; }
  return b;
}
function startAmbient(){
  const src=actx.createBufferSource(); src.buffer=noiseBuffer(4,true); src.loop=true;
  const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=650;
  const gust=actx.createGain(); gust.gain.value=1;
  const lfo=actx.createOscillator(); lfo.frequency.value=0.12; const lg=actx.createGain(); lg.gain.value=0.45; lfo.connect(lg).connect(gust.gain);
  windGain=actx.createGain(); windGain.gain.value=0;
  src.connect(f).connect(gust).connect(windGain).connect(master); src.start(); lfo.start();
  const o1=actx.createOscillator(); o1.type='triangle'; o1.frequency.value=100;
  const o2=actx.createOscillator(); o2.type='sine'; o2.frequency.value=200;
  const hf=actx.createBiquadFilter(); hf.type='lowpass'; hf.frequency.value=400;
  humGain=actx.createGain(); humGain.gain.value=0;
  o1.connect(hf); o2.connect(hf); hf.connect(humGain).connect(master); o1.start(); o2.start();
}
function setAmbient(type){
  if(!actx||!windGain) return; const t=actx.currentTime;
  const w={wind:0.2,site:0.07,room:0.025}[type]||0, hm={site:0.03,room:0.02}[type]||0;
  windGain.gain.setTargetAtTime(w,t,0.4); humGain.gain.setTargetAtTime(hm,t,0.4);
}
function tone(freq,dur,{type='sine',vol=0.2,delay=0,slide=0}={}){
  if(!actx) return; const t=actx.currentTime+delay;
  const o=actx.createOscillator(); o.type=type; o.frequency.setValueAtTime(freq,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  const g=actx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(master); o.start(t); o.stop(t+dur+0.05);
}
function noiseHit(dur,{type='bandpass',freq=1000,vol=0.2,q=0.8}={}){
  if(!actx) return; const s=actx.createBufferSource(); s.buffer=noiseBuffer(dur+0.1,false);
  const f=actx.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q; const t=actx.currentTime;
  const g=actx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f).connect(g).connect(master); s.start(t); s.stop(t+dur+0.1);
}
const sfx={
  ok(){ tone(784,0.15,{vol:0.25}); tone(1175,0.28,{vol:0.25,delay:0.12}); },
  ng(){ tone(180,0.3,{type:'square',vol:0.06}); },
  tick(){ tone(1000,0.06,{vol:0.12}); },
  clear(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.3,{vol:0.2,delay:i*0.12})); },
  whoosh(){ if(!actx) return; const s=actx.createBufferSource(); s.buffer=noiseBuffer(2,false);
    const f=actx.createBiquadFilter(); f.type='bandpass'; f.Q.value=0.8; const t=actx.currentTime;
    f.frequency.setValueAtTime(300,t); f.frequency.exponentialRampToValueAtTime(2500,t+1.5);
    const g=actx.createGain(); g.gain.setValueAtTime(0.001,t); g.gain.exponentialRampToValueAtTime(0.45,t+1.4); g.gain.exponentialRampToValueAtTime(0.001,t+1.7);
    s.connect(f).connect(g).connect(master); s.start(t); s.stop(t+1.8); },
  thud(){ tone(90,0.7,{vol:0.9,slide:28}); tone(55,0.9,{type:'triangle',vol:0.6,slide:25}); },
  zap(){ tone(120,0.45,{type:'sawtooth',vol:0.12}); tone(60,0.45,{type:'square',vol:0.05}); noiseHit(0.4,{freq:2600,vol:0.08}); },
  splat(){ noiseHit(0.25,{type:'lowpass',freq:900,vol:0.35}); tone(140,0.15,{vol:0.2,slide:70}); },
  grind(d){ tone(190,d,{type:'sawtooth',vol:0.06}); tone(380,d,{type:'square',vol:0.02}); noiseHit(d,{freq:5000,vol:0.05,q:1.5}); },
  bang(){ noiseHit(0.2,{type:'lowpass',freq:700,vol:0.4}); tone(85,0.25,{vol:0.4,slide:50}); },
};

/* =====================================================================
   トゥイーン・位置・移動
   ===================================================================== */
const tweens=[];
const tween=(dur,fn)=>new Promise(res=>tweens.push({t:0,dur,fn,res}));
const wait=s=>tween(s,()=>{});
const fade=(a,b,d)=>tween(d,k=>{ black.material.opacity=a+(b-a)*k; });
function updateTweens(dt){
  for(let i=tweens.length-1;i>=0;i--){ const tw=tweens[i]; tw.t+=dt; const k=Math.min(1,tw.t/tw.dur); tw.fn(k); if(k>=1){ tweens.splice(i,1); tw.res(); } }
}
let pcYaw=0, pcPitch=-0.3;
const headPos=()=>camera.getWorldPosition(new THREE.Vector3());
function alignRig(target,yaw,pitch=-0.3){
  target=V(target);
  if(renderer.xr.isPresenting){
    const d=new THREE.Vector3(); camera.getWorldDirection(d);
    rig.rotation.y += yaw-Math.atan2(-d.x,-d.z);
    rig.position.y = target.y; rig.updateMatrixWorld(true);
    const p=headPos(); rig.position.x+=target.x-p.x; rig.position.z+=target.z-p.z;
  } else {
    rig.position.copy(target); rig.rotation.y=0; pcYaw=yaw; pcPitch=pitch;
    camera.rotation.set(pcPitch,pcYaw,0,'YXZ');
  }
}
const toStart=()=>alignRig(cur.start,0,cur.id==='ashiba'?-0.3:-0.1);
function allowed(x,z){
  const b=cur.bounds; if(x<b[0]||x>b[1]||z<b[2]||z>b[3]) return false;
  for(const [x0,x1,z0,z1] of cur.blocks) if(x>x0&&x<x1&&z>z0&&z<z1) return false;
  return true;
}
function moveHead(d){
  const p=headPos();
  if(!allowed(p.x,p.z)){ rig.position.x+=d.x; rig.position.z+=d.z; return; }
  for(const [dx,dz] of [[d.x,d.z],[d.x,0],[0,d.z]]){ if(allowed(p.x+dx,p.z+dz)){ rig.position.x+=dx; rig.position.z+=dz; return; } }
}
function snapTurn(a){ const p0=headPos(); rig.rotation.y+=a; rig.updateMatrixWorld(true); const p1=headPos(); rig.position.x+=p0.x-p1.x; rig.position.z+=p0.z-p1.z; }

/* =====================================================================
   シナリオの読み込み・ゲーム進行
   ===================================================================== */
function disposeTree(o){ o.traverse(c=>{ if(c.geometry) c.geometry.dispose(); const ms=Array.isArray(c.material)?c.material:(c.material?[c.material]:[]); ms.forEach(m=>{ if(m.map) m.map.dispose(); m.dispose(); }); }); }
const hitMat=new THREE.MeshBasicMaterial({colorWrite:false,depthWrite:false,side:THREE.DoubleSide});
function loadScenario(sc){
  if(worldGroup){ scene.remove(worldGroup); disposeTree(worldGroup); }
  worldGroup=new THREE.Group(); scene.add(worldGroup);
  cur=sc; pickWorld=[]; rayTargets=[];
  scene.background=new THREE.Color(sc.sky); scene.fog=new THREE.Fog(sc.sky,sc.fog[0],sc.fog[1]);
  sc.build(worldGroup);
  hazards=sc.hazards.map(d=>({...d,found:false}));
  hitBoxes=hazards.map(h=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(...h.size),hitMat); m.position.set(...h.center); m.userData.haz=h; worldGroup.add(m); h.hit=m; h.box=new THREE.Box3().setFromCenterAndSize(V(h.center),V(h.size)); return m; });
  const sh=V(sc.start).add(new THREE.Vector3(0,1.6,0));
  for(const p of [menu,intro,result]){ p.mesh.position.set(...sc.panel); p.mesh.lookAt(sh); }
  result.mesh.position.addScaledVector(sh.clone().sub(result.mesh.position).setY(0).normalize(),-0.25);
  setAmbient(sc.ambient);
}

let state='idle', timeLeft=90, found=0, wrong=0, lastSec=-1;
function resetHazards(){
  hazards.forEach(h=>h.found=false); found=0; wrong=0; wrongMarks.length=0;
  while(markers.children.length) markers.remove(markers.children[0]);
}
function goMenu(){ loadScenario(LOBBY); resetHazards(); state='menu'; showPanel(menu); hud.mesh.visible=false; resetFX(); toStart(); }
function goIntro(sc){ loadScenario(sc); enterIntro(); }
function enterIntro(){ resetHazards(); state='intro'; drawIntro(); showPanel(intro); hud.mesh.visible=false; resetFX(); toStart(); }
function startGame(){ resetHazards(); timeLeft=cur.timeLimit; lastSec=-1; state='play'; showPanel(null); hud.mesh.visible=true; drawHud(); }
function endGame(reason){ if(state!=='play') return; state='ending'; hud.mesh.visible=false; runEnding(reason); }
function showResult(reason,fell){ lastResult={reason,fell}; drawResult(); showPanel(result); state='result'; }
async function transition(fn){ state='busy'; await fade(0,1,0.35); fn(); await fade(1,0,0.35); }

function discover(h,src){
  h.found=true; found++;
  const bx=new THREE.BoxGeometry(...h.size);
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(bx),new THREE.LineBasicMaterial({color:0x22ff66,depthTest:false,transparent:true}));
  e.position.copy(h.hit.position); e.renderOrder=40; markers.add(e);
  const f=new THREE.Mesh(bx,new THREE.MeshBasicMaterial({color:0x22ff66,transparent:true,opacity:0.15,depthWrite:false,fog:false}));
  f.position.copy(h.hit.position); markers.add(f);
  const l=makeLabel(`危険発見！ ${h.short}`,'#16a34a'); l.position.set(h.center[0],h.center[1]+h.size[1]/2+0.22,h.center[2]); markers.add(l);
  sfx.ok(); pulse(src,0.8,80); drawHud();
  if(found===hazards.length) endGame('all');
}
function markWrong(p,src){
  wrong++; timeLeft=Math.max(0,timeLeft-PENALTY); drawHud();
  const s=makeLabel(`× −${PENALTY}秒`,'#dc2626',0.14); s.position.copy(p); markers.add(s); wrongMarks.push({s,t:0});
  sfx.ng(); pulse(src,0.3,40);
}
function pulse(src,i,d){ try{ src?.gamepad?.hapticActuators?.[0]?.pulse(i,d); }catch(e){} }
function hapticAll(i,d){ if(renderer.xr.isPresenting) for(const s of renderer.xr.getSession().inputSources) pulse(s,i,d); }

function handlePick(rc,src){
  const bh=rc.intersectObjects(activeButtonMeshes(),false)[0];
  if(bh){ bh.object.userData.btn.onClick(); return; }
  if(state!=='play') return;
  const hzs=rc.intersectObjects(hitBoxes,false);
  const hz=hzs.find(i=>!i.object.userData.haz.found)||hzs[0];   // 発見済みの枠は素通りして奥の危険も指せる
  const wh=rc.intersectObjects(pickWorld,true)[0];
  if(hz && (!wh || hz.distance<=wh.distance+0.6)){ const h=hz.object.userData.haz; if(!h.found) discover(h,src); return; }
  if(wh && wh.distance<40){
    // 危険の枠の中にある物を指した場合も「発見」扱い（近づいて指したとき用）
    const inBox=hazards.find(h=>!h.found && h.box.containsPoint(wh.point));
    if(inBox){ discover(inBox,src); return; }
    if(hazards.some(h=>h.found && h.box.containsPoint(wh.point))) return;
    markWrong(wh.point,src);
  }
}

async function runEnding(reason){
  const missed=hazards.filter(h=>!h.found);
  if(missed.length===0){
    sfx.clear(); showCaption('全ての危険を発見！',cur.clearCall);
    await wait(2.8); hideCaption(); await fade(0,1,0.5);
    toStart(); showResult(reason,null); await fade(1,0,0.6); return;
  }
  const h=missed[Math.floor(Math.random()*missed.length)];
  showCaption(reason==='timeup'?'時間切れ！':'終了',`見落とした危険：${h.name}\nもしこのまま作業を続けていたら…`);
  await wait(3.2);
  await fade(0,1,0.5); hideCaption();
  await playExperience(h,4.2);
  toStart(); showResult(reason,h);
  await fade(1,0,0.8);
}
// 危険の場所へ移動 → 説明 → 疑似体験 → 暗転して締めの字幕（終了時は画面が暗転したまま）
async function playExperience(h,endWait){
  const from=V(h.exp.from), look=V(h.exp.look), dx=look.x-from.x, dz=look.z-from.z;
  alignRig(from,Math.atan2(-dx,-dz),clamp(Math.atan2(look.y-(from.y+1.6),Math.hypot(dx,dz)),-0.95,0.95));
  await fade(1,0,0.5);
  showCaption('',h.exp.text);
  await wait(2.2); hideCaption();
  await cur.experience(h);
  black.material.opacity=1;
  await wait(0.9);
  showCaption(cur.endTitle,cur.endBody);
  await wait(endWait); hideCaption(); setVignette(0,0.6);
}
// 結果画面から、選んだ項目の演出だけを見直す
async function replayExperience(h){
  state='replay'; initAudio();
  await fade(0,1,0.4); showPanel(null);
  showCaption('演出の確認',`「${h.name}」\nもしこの危険を見落としていたら…`);
  await wait(2.2); hideCaption();
  await playExperience(h,3.0);
  toStart(); showPanel(result); state='result';
  await fade(1,0,0.6);
}

/* =====================================================================
   VRコントローラー・PC操作
   ===================================================================== */
const controllers=[];
const factory=new XRControllerModelFactory();
const rc=new THREE.Raycaster();
const tmpM=new THREE.Matrix4();
function rayFromController(c){ tmpM.identity().extractRotation(c.matrixWorld); rc.ray.origin.setFromMatrixPosition(c.matrixWorld); rc.ray.direction.set(0,0,-1).applyMatrix4(tmpM); }
for(let i=0;i<2;i++){
  const c=renderer.xr.getController(i);
  const lineGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(0,0,-1)]);
  const line=new THREE.Line(lineGeo,new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.8}));
  line.scale.z=5; line.visible=false; c.add(line);
  const ret=new THREE.Mesh(new THREE.SphereGeometry(0.012,10,8),new THREE.MeshBasicMaterial({color:0xffee55,depthTest:false,fog:false}));
  ret.renderOrder=45; ret.visible=false; c.add(ret);
  c.userData={line,ret,src:null};
  c.addEventListener('connected',e=>{ c.userData.src=e.data; line.visible=e.data.targetRayMode==='tracked-pointer'; });
  c.addEventListener('disconnected',()=>{ c.userData.src=null; line.visible=false; ret.visible=false; });
  c.addEventListener('selectstart',()=>{ initAudio(); rayFromController(c); handlePick(rc,c.userData.src); });
  rig.add(c); controllers.push(c);
  const grip=renderer.xr.getControllerGrip(i); grip.add(factory.createControllerModel(grip)); rig.add(grip);
}
function updateVRPointers(hoverSet){
  for(const c of controllers){
    const u=c.userData; if(!u.src||!u.line.visible) continue;
    rayFromController(c);
    let dist=5, hit=false;
    const bh=rc.intersectObjects(activeButtonMeshes(),false)[0];
    if(bh){ hoverSet.add(bh.object.userData.btn); dist=bh.distance; hit=true; u.line.material.color.set(0xfde047); }
    else { u.line.material.color.set(0xffffff); const wh=rc.intersectObjects(rayTargets,true)[0]; if(wh&&wh.distance<20){ dist=wh.distance; hit=true; } }
    u.line.scale.z=dist; u.ret.position.set(0,0,-dist); u.ret.scale.setScalar(Math.max(1,dist*0.6)); u.ret.visible=hit;
  }
}
const canvas=renderer.domElement;
const keys={};
addEventListener('keydown',e=>{ keys[e.code]=true; });
addEventListener('keyup',e=>{ keys[e.code]=false; });
let pDown=null, pcHover=null;
const ndc=new THREE.Vector2();
function setRayFromMouse(e){ ndc.set((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1); rc.setFromCamera(ndc,camera); }
canvas.addEventListener('pointerdown',e=>{ if(renderer.xr.isPresenting) return; pDown={x:e.clientX,y:e.clientY,moved:false}; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove',e=>{
  if(renderer.xr.isPresenting) return;
  if(pDown){
    if(Math.abs(e.clientX-pDown.x)+Math.abs(e.clientY-pDown.y)>5) pDown.moved=true;
    if(pDown.moved){ pcYaw-=e.movementX*0.0045; pcPitch=clamp(pcPitch-e.movementY*0.0045,-1.45,1.2); }
  } else {
    setRayFromMouse(e); const bh=rc.intersectObjects(activeButtonMeshes(),false)[0];
    pcHover=bh?bh.object.userData.btn:null; canvas.style.cursor=pcHover?'pointer':'crosshair';
  }
});
canvas.addEventListener('pointerup',e=>{ if(renderer.xr.isPresenting) return; if(pDown&&!pDown.moved){ initAudio(); setRayFromMouse(e); handlePick(rc,null); } pDown=null; });
canvas.style.cursor='crosshair';

let snapCool=0, vigAmt=0;
function handleInput(dt){
  const xr=renderer.xr.isPresenting;
  const canMove=(state==='menu'||state==='intro'||state==='play'||state==='result');
  let mx=0, mz=0;
  if(xr){
    for(const src of renderer.xr.getSession().inputSources){
      const gp=src.gamepad; if(!gp) continue;
      const x=(gp.axes.length>=4?gp.axes[2]:gp.axes[0])||0, y=(gp.axes.length>=4?gp.axes[3]:gp.axes[1])||0;
      if(src.handedness==='left'){ if(Math.abs(x)>0.15) mx=x; if(Math.abs(y)>0.15) mz=y; }
      else if(src.handedness==='right' && canMove && snapCool<=0 && Math.abs(x)>0.7){ snapTurn(x>0?-Math.PI/6:Math.PI/6); snapCool=0.35; }
    }
  } else {
    if(keys.KeyW||keys.ArrowUp) mz-=1; if(keys.KeyS||keys.ArrowDown) mz+=1;
    if(keys.KeyA||keys.ArrowLeft) mx-=1; if(keys.KeyD||keys.ArrowRight) mx+=1;
  }
  snapCool-=dt;
  const moving=canMove&&(mx!==0||mz!==0);
  if(moving){
    const fwd=new THREE.Vector3(); camera.getWorldDirection(fwd); fwd.y=0; fwd.normalize();
    const right=new THREE.Vector3(-fwd.z,0,fwd.x);
    const d=fwd.multiplyScalar(-mz).addScaledVector(right,mx); if(d.lengthSq()>1) d.normalize();
    moveHead(d.multiplyScalar(1.4*dt));
  }
  if(state!=='ending'&&state!=='replay'){ vigAmt+=(((moving&&xr)?0.9:0)-vigAmt)*Math.min(1,dt*8); setVignette(vigAmt,0.55); }
  if(!xr) camera.rotation.set(pcPitch,pcYaw,0,'YXZ');
}

/* =====================================================================
   メインループ・開始
   ===================================================================== */
const clock=new THREE.Clock();
let frame=0, needAlign=0;
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),0.1); frame++;
  if(needAlign && renderer.xr.isPresenting && frame>needAlign){ toStart(); needAlign=0; }
  updateTweens(dt);
  handleInput(dt);
  if(state==='play'){
    timeLeft-=dt; const s=Math.ceil(timeLeft);
    if(s!==lastSec){ lastSec=s; drawHud(); if(s<=10&&s>0) sfx.tick(); }
    if(timeLeft<=0) endGame('timeup');
  }
  for(let i=wrongMarks.length-1;i>=0;i--){ const w=wrongMarks[i]; w.t+=dt; w.s.material.opacity=Math.max(0,1-w.t/1.2); if(w.t>1.2){ markers.remove(w.s); wrongMarks.splice(i,1); } }
  black.visible=black.material.opacity>0.001; whiteOv.visible=whiteOv.material.opacity>0.001;
  const hoverSet=new Set();
  if(renderer.xr.isPresenting) updateVRPointers(hoverSet); else if(pcHover) hoverSet.add(pcHover);
  for(const b of buttons) b.setHover(hoverSet.has(b));
  renderer.render(scene,camera);
});
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

// URLで直接シナリオを指定できます（例：index.html?s=kanden）
const directSc=SCENARIOS.find(s=>s.id===URLP.get('s'));
function begin(){ if(directSc) goIntro(directSc); else goMenu(); }
function idleScene(){ if(SOLO&&directSc) goIntro(directSc); else goMenu(); state='idle'; }
idleScene();
if(SOLO&&directSc){ document.querySelector('.card h1').textContent=`KY体験VR：${directSc.title}`; document.title=`KY体験VR：${directSc.title}`; }

const overlay=document.getElementById('overlay'), statusEl=document.getElementById('status'), vrBtn=document.getElementById('vrBtn');
document.getElementById('fxOpt').addEventListener('change',e=>setEffect(e.target.checked));
if('xr' in navigator){
  navigator.xr.isSessionSupported('immersive-vr').then(ok=>{
    if(ok){ vrBtn.disabled=false; statusEl.textContent=''; }
    else statusEl.textContent='この端末・ブラウザはVR非対応です。「PCで開始」をお使いください。';
  }).catch(()=>{ statusEl.textContent='VR対応を確認できませんでした。'; });
} else {
  statusEl.textContent = window.isSecureContext ? 'このブラウザはWebXR非対応です（PC体験は可能）。' : 'VRで使うにはHTTPSで公開したURLから開いてください（PC体験は可能）。';
}
vrBtn.addEventListener('click',async()=>{
  initAudio();
  try{
    const session=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor','hand-tracking']});
    await renderer.xr.setSession(session);
    session.addEventListener('end',()=>{
      tweens.length=0; resetFX();
      camera.position.set(0,1.6,0); camera.quaternion.identity(); rig.rotation.y=0;
      idleScene(); overlay.style.display='flex';
    });
    overlay.style.display='none'; document.getElementById('pcHelp').style.display='none';
    begin(); needAlign=frame+5;
  }catch(e){ statusEl.textContent='VRを開始できませんでした：'+e.message; }
});
document.getElementById('pcBtn').addEventListener('click',()=>{
  initAudio(); overlay.style.display='none'; document.getElementById('pcHelp').style.display='block'; begin();
});
</script>
